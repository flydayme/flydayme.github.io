<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B1120" />
    <title>Flyday.me — Weekend Escape</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* Темна тема */
        :root {
            --space-4: 4px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --space-32: 32px;
            --space-48: 48px;
            --space-64: 64px;

            --bg-primary: #0B1120;
            --bg-secondary: #131B2E;
            --bg-card: #1E293B;
            --bg-card-hover: #26334D;

            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;

            --accent-orange: #F97316;
            --accent-orange-hover: #EA580C;

            --slider-track: rgba(255, 255, 255, 0.15);

            --border-color: rgba(255, 255, 255, 0.12);
            --border-color-hover: rgba(249, 115, 22, 0.5);

            --radius-card: 16px;
            --radius-button: 12px;
            --radius-pill: 9999px;

            --glass-blur: blur(20px);
            --glass-bg: rgba(11, 17, 32, 0.85);

            --touch-min: 44px;
            --touch-ideal: 48px;

            --font-system: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Fira Code', monospace;

            --fs-h1: 28px;
            --lh-h1: 34px;
            --fs-h2: 22px;
            --lh-h2: 28px;
            --fs-body: 17px;
            --lh-body: 24px;
            --fs-caption: 13px;
            --lh-caption: 18px;
            --fs-button: 16px;
        }

        /* Світла тема */
        [data-theme="light"] {
            --bg-primary: #F1F5F9;
            --bg-secondary: #E2E8F0;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F8FAFC;

            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;

            --slider-track: rgba(0, 0, 0, 0.12);

            --border-color: rgba(0, 0, 0, 0.1);
            --border-color-hover: rgba(249, 115, 22, 0.5);

            --glass-bg: rgba(241, 245, 249, 0.85);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-system);
            font-size: var(--fs-body);
            line-height: var(--lh-body);
            color: var(--text-primary);
            background: var(--bg-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #radarCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-color);
            padding: var(--space-12) var(--space-16);
            transition: background 0.3s, border-color 0.3s;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            display: flex;
            align-items: baseline;
            text-decoration: none;
            transform: skewX(-4deg);
            user-select: none;
        }
        .logo .day { color: var(--accent-orange); }
        .logo .dotme {
            color: var(--text-secondary);
            font-weight: 300;
            font-size: 0.55em;
            margin-left: 0.05em;
        }

        /* Перемикач теми */
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 6px 14px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-system);
            transition: all 0.2s ease;
        }
        .theme-toggle:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }
        .theme-icon-svg {
            width: 18px;
            height: 18px;
            display: block;
            flex-shrink: 0;
        }

        .hero {
            max-width: 680px;
            margin: 0 auto;
            padding: var(--space-48) var(--space-16) var(--space-32);
            text-align: center;
        }

        .hero h1 {
            font-size: var(--fs-h1);
            font-weight: 700;
            line-height: var(--lh-h1);
            letter-spacing: -0.02em;
            margin-bottom: var(--space-8);
        }
        .hero h1 .highlight { color: var(--accent-orange); }

        .hero p {
            font-size: var(--fs-body);
            color: var(--text-secondary);
            margin-bottom: var(--space-32);
        }

        .search-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: var(--space-24);
            display: flex;
            flex-direction: column;
            gap: var(--space-20);
            text-align: left;
            transition: background 0.3s, border-color 0.3s;
        }

        .form-group {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: var(--space-8);
        }

        .label-with-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--fs-caption);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .label-icon {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            flex-shrink: 0;
        }

        .origin-input {
            width: 100%;
            min-height: var(--touch-ideal);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            padding: 0 var(--space-16);
            color: var(--text-primary);
            font-family: var(--font-system);
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, background-color 0.3s;
        }
        .origin-input:focus { border-color: var(--accent-orange); }
        .origin-input::placeholder { color: var(--text-muted); font-weight: 400; }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .autocomplete-dropdown.active { display: block; }
        .autocomplete-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: var(--bg-card-hover); }
        .autocomplete-item .city-name { font-size: 15px; color: var(--text-primary); font-weight: 500; }
        .autocomplete-item .iata-code {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--accent-orange);
            font-weight: 600;
            background: rgba(249, 115, 22, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .price-display {
            font-family: var(--font-mono);
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: -0.01em;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .price-display span {
            font-size: var(--fs-body);
            font-weight: 500;
            color: var(--text-secondary);
            font-family: var(--font-system);
        }

        .slider-container {
            position: relative;
            width: 100%;
            padding: 8px 0;
        }

        .price-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--slider-track);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            margin: 0;
            border: none;
            box-shadow: none;
            transition: background 0.3s;
        }

        .price-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: var(--slider-track);
            border-radius: 3px;
            border: none;
            box-shadow: none;
        }

        .price-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-orange);
            cursor: pointer;
            margin-top: -8px;
            border: none;
            box-shadow: none;
            transition: transform 0.15s;
        }
        .price-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }

        .price-slider::-moz-range-track {
            width: 100%;
            height: 6px;
            background: var(--slider-track);
            border-radius: 3px;
            border: none;
            box-shadow: none;
        }

        .price-slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: var(--accent-orange);
            cursor: pointer;
            box-shadow: none;
            transition: transform 0.15s;
        }
        .price-slider::-moz-range-thumb:hover { transform: scale(1.15); }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: var(--space-8);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .cta-button {
            width: 100%;
            min-height: var(--touch-ideal);
            padding: 0 var(--space-24);
            background: var(--accent-orange);
            border: none;
            border-radius: var(--radius-pill);
            color: #FFFFFF;
            font-family: var(--font-system);
            font-size: var(--fs-button);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-8);
        }
        .cta-button:hover { background: var(--accent-orange-hover); }
        .cta-button:active { transform: scale(0.98); }

        /* Адаптивний спінер Flyday.me */
        .spinner {
            width: 40px;
            height: 12px;
            position: relative;
            display: inline-block;
        }

        .spinner::before,
        .spinner::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-orange);
            animation: chase 1.2s ease-in-out infinite;
        }

        .spinner::after {
            animation-delay: -0.6s;
            background: var(--text-primary);
            opacity: 0.6;
        }

        @keyframes chase {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(28px); }
        }

        .results-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-16) var(--space-64);
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-8);
            margin-bottom: var(--space-20);
        }
        .results-header h2 { font-size: var(--fs-h2); font-weight: 600; color: var(--text-primary); }
        .results-header .date-info {
            font-family: var(--font-mono);
            font-size: var(--fs-caption);
            color: var(--text-muted);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-16);
        }
        @media (min-width: 640px) { .cards-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-20); } }
        @media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); gap: var(--space-20); } }

        .flight-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: var(--space-20);
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: var(--space-12);
        }
        .flight-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-color-hover);
            transform: translateY(-4px);
        }

        .hot-deal {
            position: absolute;
            top: var(--space-16);
            right: var(--space-16);
            background: var(--accent-orange);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            line-height: 1;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: var(--space-16);
        }

        .destination-code {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .destination-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .destination-city { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .destination-country { font-size: var(--fs-caption); color: var(--text-muted); text-transform: uppercase; }

        .card-timings {
            display: flex;
            flex-direction: column;
            gap: var(--space-8);
            padding: var(--space-12) var(--space-16);
            background: var(--bg-secondary);
            border-radius: var(--radius-button);
        }
        .timing-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: var(--fs-caption);
        }
        .timing-label { color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 11px; }
        .timing-value { font-family: var(--font-mono); color: var(--text-secondary); font-weight: 500; }

        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .airline-name { font-size: var(--fs-caption); color: var(--text-secondary); font-weight: 500; }
        .price-tag {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .price-tag .roundtrip { font-size: 12px; color: var(--text-muted); font-family: var(--font-system); font-weight: 400; }

        .book-button {
            width: 100%;
            min-height: var(--touch-min);
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            color: var(--text-primary);
            font-size: var(--fs-button);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .book-button:hover {
            background: var(--accent-orange);
            color: #FFFFFF;
            border-color: var(--accent-orange);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-48) var(--space-24);
            grid-column: 1 / -1;
        }
        .empty-state h3 { font-size: var(--fs-h2); font-weight: 600; margin-bottom: var(--space-8); }
        .empty-state p { font-size: var(--fs-body); color: var(--text-secondary); }

        .footer {
            text-align: center;
            padding: var(--space-24) var(--space-16);
            color: var(--text-muted);
            font-size: var(--fs-caption);
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
            transition: background 0.3s, border-color 0.3s;
        }
        .footer a { color: var(--text-secondary); text-decoration: none; }
        .footer a:hover { color: var(--accent-orange); }
    </style>
</head>
<body>

    <canvas id="radarCanvas"></canvas>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-inner">
                <a href="#" class="logo" aria-label="Flyday.me home">
                    fly<span class="day">day</span><span class="dotme">.me</span>
                </a>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggleBtn">
                        <span id="themeIcon">
                            <!-- Акуратне сонце -->
                            <svg class="theme-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M18.66 4.93l-1.41 1.41"></path>
                            </svg>
                        </span>
                        <span id="themeText">Light</span>
                    </button>
                </div>
            </div>
        </header>

        <section class="hero">
            <h1 id="heroTitle">Escape <span class="highlight">This Weekend</span></h1>
            <p id="heroSub">Find the cheapest round-trip flights from your city for Friday &mdash; Sunday</p>

            <div class="search-panel">
                <div class="form-group">
                    <label for="originInput" class="label-with-icon" id="labelOrigin">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.7 5.2c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
                        </svg>
                        Departure City
                    </label>
                    <input type="text"
                           id="originInput"
                           class="origin-input"
                           placeholder="Type city (e.g. Berlin, London)"
                           value="Berlin (BER)"
                           autocomplete="off"
                           spellcheck="false" />
                    <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
                </div>

                <div class="form-group">
                    <label for="priceSlider" class="label-with-icon" id="labelBudget">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="12" x="2" y="6" rx="2"/>
                            <circle cx="12" cy="12" r="2"/>
                            <path d="M6 12h.01M18 12h.01"/>
                        </svg>
                        Maximum Budget
                    </label>
                    <div class="price-display" id="priceDisplay">€120 <span id="roundTripText">round-trip</span></div>
                    <div class="slider-container">
                        <input type="range"
                               class="price-slider"
                               id="priceSlider"
                               min="50"
                               max="300"
                               step="10"
                               value="120"
                               aria-label="Maximum budget" />
                        <div class="slider-labels">
                            <span>€50</span>
                            <span>€300</span>
                        </div>
                    </div>
                </div>

                <button class="cta-button" id="searchBtn">
                    <span id="searchBtnText">Find Weekend Escapes</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </section>

        <section class="results-section">
            <div class="results-header">
                <h2 id="resultsTitle">Weekend Escapes</h2>
                <div class="date-info" id="dateInfo">2026-09-11 → 2026-09-13 · BER</div>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>
        </section>

        <footer class="footer">
            Flyday.me &middot; European Weekend Flight Finder
            <span style="margin: 0 8px;">&middot;</span>
            <a href="#">Privacy</a>
            <span style="margin: 0 8px;">&middot;</span>
            <a href="#">Terms</a>
        </footer>
    </div>

    <!-- Анімація Canvas -->
    <script>
        (function() {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            // Завантажуємо два зображення: для темної та світлої теми
            const planeDark = new Image();
            planeDark.src = 'plane.svg';

            const planeLight = new Image();
            planeLight.src = 'plane_black.svg';

            class Plane {
                constructor(altitudeLevel) {
                    this.altitude = altitudeLevel;
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = 0.5 + this.altitude * 0.4;
                    this.size = 14 + this.altitude * 4;
                    this.opacity = 0.2 + (this.altitude / 3) * 0.3;

                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                }

                update() {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;

                    const buffer = 60;
                    if (this.x < -buffer) this.x = width + buffer;
                    if (this.x > width + buffer) this.x = -buffer;
                    if (this.y < -buffer) this.y = height + buffer;
                    if (this.y > height + buffer) this.y = -buffer;
                }

                draw() {
                    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                    const img = isLight ? planeLight : planeDark;

                    // Якщо зображення ще не завантажене – пропускаємо малювання
                    if (!img.complete || img.naturalWidth === 0) return;

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle + Math.PI / 2);

                    ctx.globalAlpha = this.opacity;
                    ctx.drawImage(
                        img,
                        -this.size / 2,
                        -this.size / 2,
                        this.size,
                        this.size
                    );

                    ctx.restore();
                }
            }

            const planes = [];
            const TOTAL_PLANES = 10;

            // Чекаємо завантаження хоча б одного зображення, але краще дочекатися обох
            let loaded = 0;
            function onImageLoad() {
                loaded++;
                if (loaded === 2) {
                    for (let i = 0; i < TOTAL_PLANES; i++) {
                        const altitude = (i % 3) + 1;
                        planes.push(new Plane(altitude));
                    }
                    planes.sort((a, b) => a.altitude - b.altitude);
                    animate();
                }
            }

            planeDark.onload = onImageLoad;
            planeLight.onload = onImageLoad;

            // Якщо зображення вже завантажені (кеш) – викликаємо onload одразу
            if (planeDark.complete) onImageLoad();
            if (planeLight.complete) onImageLoad();

            function animate() {
                ctx.clearRect(0, 0, width, height);
                planes.forEach(plane => {
                    plane.update();
                    plane.draw();
                });
                requestAnimationFrame(animate);
            }
        })();
    </script>
